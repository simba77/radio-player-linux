[project]
name = "radio-player"
version = "0.1.0"
description = "Минималистичный плеер интернет-радио для Linux"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "simba77", email = "itenterprise105@gmail.com" }]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "PySide6>=6.6",
    "python-mpv>=1.0",
]

[project.urls]
Homepage = "https://github.com/simba77/radio-player-linux"
Source = "https://github.com/simba77/radio-player-linux"
Issues = "https://github.com/simba77/radio-player-linux/issues"

[project.scripts]
radio-player = "radio_player.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["radio_player*"]

[tool.setuptools.package-data]
radio_player = ["resources/**/*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B", "SIM",
    "ARG",   # неиспользуемые аргументы — обычно след недоделанного рефакторинга
    "C4",    # лишние генераторы вокруг list/dict/set
    "G",     # форматирование в вызовах logging
    "LOG",   # ошибки в работе с logging
    "N",     # именование по PEP 8
    "PERF",  # очевидно лишняя работа в циклах
    "PTH",   # os.path там, где проект живёт на pathlib
    "RET",   # запутанные возвраты
    "RUF",   # в том числе RUF100: noqa, который ничего не подавляет
    "S",     # bandit: подозрительные конструкции
    "TRY",   # обработка исключений
]
ignore = [
    # Кириллица в комментариях и строках — не «символ, похожий на латинский»,
    # а язык, на котором в этом проекте написаны комментарии.
    "RUF001", "RUF002", "RUF003",
    # Требует заводить класс исключения ради каждого сообщения. Ошибки здесь
    # либо уходят пользователю текстом, либо не покидают модуль.
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
# assert — рабочий инструмент теста, а не подозрительная конструкция.
# S314: тесты разбирают наши же `.ts` из репозитория, а не чужой XML.
"tests/*" = ["S101", "S314"]
# Имена методов и свойств здесь задаёт спецификация MPRIS: по ним приложение
# находят на шине, переименовать их нельзя.
"radio_player/mpris.py" = ["N802"]

[tool.ruff.lint.pep8-naming]
# Имена переопределяемых методов Qt и обходчика ast выбраны не нами.
extend-ignore-names = ["closeEvent", "mousePressEvent", "visit_*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "radio-player"
version = "0.1.0"
description = "Минималистичный плеер интернет-радио для Linux"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "simba77", email = "itenterprise105@gmail.com" }]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "PySide6>=6.6",
    "python-mpv>=1.0",
]

[project.urls]
Homepage = "https://github.com/simba77/radio-player-linux"
Source = "https://github.com/simba77/radio-player-linux"
Issues = "https://github.com/simba77/radio-player-linux/issues"

[project.scripts]
radio-player = "radio_player.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["radio_player*"]

[tool.setuptools.package-data]
radio_player = ["resources/**/*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

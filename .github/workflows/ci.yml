name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# Пуш поверх незавершённого прогона отменяет предыдущий: проверять
# промежуточное состояние ветки незачем.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # Ubuntu 24.04 — это Qt 6.4. Сборка здесь не даёт коду опереться на API
      # новее, чем есть в поддерживаемых дистрибутивах, хотя локально Qt свежее.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config dpkg-dev file qt6-base-dev qt6-tools-dev qt6-l10n-tools \
            libqt6svg6 libmpv-dev catch2 dbus desktop-file-utils appstream

      - name: Configure
        run: cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-Werror

      - name: Build
        run: cmake --build build/release

      # Тесты MPRIS и запрета засыпания поднимают свой dbus-daemon: сеансовой
      # шины на раннере нет, а проверять сигнатуры нужно на настоящей.
      - name: Test
        run: ctest --test-dir build/release --output-on-failure -j "$(nproc)"

      - name: Validate the desktop entry and AppStream data
        run: |
          desktop-file-validate data/io.github.simba77.RadioPlayer.desktop
          appstreamcli validate --no-net \
            packaging/appstream/io.github.simba77.RadioPlayer.metainfo.xml

      # Собранные на 24.04 пакеты ставятся и там, и на более новых системах:
      # зависимости от Qt dpkg-shlibdeps выводит по самой старой версии.
      - name: Build packages
        working-directory: build/release
        run: cpack

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            build/release/*.deb
            build/release/*.tar.gz
          if-no-files-found: error

  # Форматирование, скрипты и тесты в отладочной сборке с ASan/UBSan и покрытием:
  # ошибки памяти не видны в обычном прогоне, а порог покрытия не даёт тестам
  # отстать от кода. Инструменты — из .venv с версиями из requirements-dev.txt,
  # поэтому CI раскладывает код так же, как машина разработчика.
  check:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config qt6-base-dev qt6-tools-dev qt6-l10n-tools \
            libqt6svg6 libmpv-dev catch2 dbus python3-venv

      - name: Create the development environment
        run: make devenv

      - name: Check
        run: make check

  # На тег v* пакеты прикрепляются к выпуску на GitHub.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, check]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages

      - name: Attach the packages to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Radio Player ${TAG#v}" --generate-notes
          gh release upload "$TAG" packages/* --clobber

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Пуш поверх незавершённого прогона отменяет предыдущий: проверять
# промежуточное состояние ветки незачем.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      # Дисплея на раннере нет, а тестам Qt хватает offscreen-платформы.
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      # libmpv нужен настоящий: без него тест запуска приложения пропускается.
      # Остальное — системные библиотеки, на которые опирается Qt из колеса.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-venv libmpv2 \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            desktop-file-utils appstream

      - name: Create the development environment
        run: make devenv

      # На машине разработчика (KDE neon) PySide6 и python-mpv приходят из
      # пакетов дистрибутива, поэтому .venv и создаётся с --system-site-packages.
      # В Ubuntu 24.04 пакетов python3-pyside6.* нет вовсе, так что здесь берём
      # колёса с PyPI. Оно же несёт плагин SVG и переводы Qt.
      - name: Install the runtime dependencies from PyPI
        run: .venv/bin/pip install --quiet PySide6 python-mpv

      - name: Lint
        run: make lint

      # shellcheck берётся из .venv, а не из apt: иначе версия на раннере
      # и версия в pre-commit расходятся, и CI краснеет на том, что локально
      # проходило.
      - name: Check the shell scripts
        run: make shellcheck

      - name: Typecheck
        run: make typecheck

      # Сюда же входит проверка каталога переводов на дрейф от кода
      # и порог покрытия.
      - name: Test
        run: make coverage

      - name: Validate the desktop entry and AppStream data
        run: |
          desktop-file-validate radio_player/resources/io.github.simba77.RadioPlayer.desktop
          appstreamcli validate --no-net \
            packaging/appstream/io.github.simba77.RadioPlayer.metainfo.xml

      # Упаковка ломается тише кода: заметить это до релиза можно только сборкой.
      - name: Build the package
        run: make deb

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb
          if-no-files-found: error

# Покрытие C++-кода: `make cpp-coverage`. Планка держит уровень, а не гонится
# за цифрой: она ниже текущего покрытия, чтобы обычная правка не красила сборку,
# но не даёт ему просесть.
root = .
filter = src/
exclude-throw-branches = yes
exclude-unreachable-branches = yes
print-summary = yes
fail-under-line = 80

# Ставится отдельно: `pip install pre-commit && pre-commit install`.
# Версии совпадают с requirements-dev.txt — иначе хук и CI расходятся
# в том, что считать ошибкой.
repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.7
    hooks:
      - id: clang-format
        types_or: [c++]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      # Иконки — бинарные, но идут в репозиторий намеренно; остальное крупное
      # лучше заметить до коммита.
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
